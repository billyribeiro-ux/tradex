name: CI

on:
  push:
    branches: ['main', 'claude/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: pglite://.pgdata
      ORIGIN: http://localhost:5173
      BETTER_AUTH_SECRET: ci-only-secret-not-used-at-build-time
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint + prettier)
        run: pnpm run lint

      - name: Typecheck (svelte-check, strict)
        run: pnpm run check

      - name: Unit + integration tests
        run: pnpm exec vitest run --project server

      - name: Build (adapter-node)
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: pglite://.pgdata
      BETTER_AUTH_SECRET: e2e-ci-secret-change-me
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: pnpm exec playwright test
